# Keep local builds light: two workers, no daemon and a capped heap.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false
# Compile Kotlin inside the Gradle process (no lingering KotlinCompileDaemon).
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
# The SDK has no AndroidX dependencies.
android.useAndroidX=false
android.nonTransitiveRClass=true
