name: durbun_dio
description: >-
  Dio interceptor for Dürbün: reports requests made through adapters that
  bypass dart:io (NativeAdapter, cronet_http) and applies the desktop's mocks.
version: 0.1.0
homepage: https://github.com/mykynk/durbun
repository: https://github.com/mykynk/durbun/tree/main/sdks/flutter/durbun_dio
issue_tracker: https://github.com/mykynk/durbun/issues
topics:
  - dio
  - network
  - debugging
  - inspector
  - logging

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  durbun: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
