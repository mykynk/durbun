// Android side of package:durbun.
//
// The native core (Kotlin + one Java file) lives in sdks/android/durbun, where native-only apps use it too.
// pub.dev publishes only this package folder, so the plugin compiles an exact copy of it: src/core/kotlin,
// src/core/java and core-rules.pro. Edit the original and run `dart run tool/sync_native.dart`
// (test/native_sync_test.dart fails when the copy drifts).
group = "dev.durbun.flutter"
version = "0.3.1"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// Kotlin works with both Android Gradle Plugin generations:
// - AGP 9+ compiles Kotlin itself ("built-in Kotlin", on unless the app sets android.builtInKotlin=false).
//   The Kotlin Gradle Plugin must not be applied then.
// - Older AGP, or AGP 9 with android.builtInKotlin=false, needs the Kotlin Gradle Plugin. Flutter 3.44+ applies it
//   to plugins on its own; older Flutter versions do not, so it is applied here when it is missing (applying an
//   applied plugin again does nothing). This mirrors Flutter's own check (FlutterPluginUtils.isBuiltInKotlinEnabled).
def agpMajor = project.extensions.getByName("androidComponents").pluginVersion.major
def builtInKotlin = agpMajor >= 9 &&
    providers.gradleProperty("android.builtInKotlin").getOrElse("true").toBoolean()

if (builtInKotlin) {
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
} else {
    pluginManager.apply("org.jetbrains.kotlin.android")
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
        if (task.hasProperty("compilerOptions")) {
            // Kotlin Gradle Plugin 1.8+.
            task.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        } else {
            task.kotlinOptions.jvmTarget = "17"
        }
    }
}

android {
    namespace = "dev.durbun.flutter"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        // The Kotlin Gradle Plugin compiles Kotlin found in the Java source folders; built-in Kotlin reads only the
        // Kotlin source folders (src/main/kotlin is one by default), so the copied core is listed in both.
        main.java.srcDirs("src/main/kotlin", "src/core/kotlin", "src/core/java")
        if (main.hasProperty("kotlin")) {
            main.kotlin.srcDirs("src/core/kotlin")
        }
    }

    defaultConfig {
        minSdk = 21
        // OkHttp is optional for the app (DurbunInterceptor is only loaded when the app uses it).
        consumerProguardFiles("core-rules.pro")
    }

    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    // OkHttp is the app's own dependency: DurbunInterceptor links against whatever version it ships.
    compileOnly("com.squareup.okhttp3:okhttp:4.12.0") {
        exclude group: "org.jetbrains.kotlin"
    }
}
