// Android side of package:durbun.
//
// The native core (Kotlin + one Java file) lives in sdks/android/durbun, where native-only apps use it too.
// pub.dev publishes only this package folder, so the plugin compiles an exact copy of it: src/core/kotlin,
// src/core/java and core-rules.pro. Edit the original and run `dart run tool/sync_native.dart`
// (test/native_sync_test.dart fails when the copy drifts).
group = "dev.durbun.flutter"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "dev.durbun.flutter"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += [
            "src/main/kotlin",
            "src/core/kotlin",
            "src/core/java",
        ]
    }

    defaultConfig {
        minSdk = 21
        // OkHttp is optional for the app (DurbunInterceptor is only loaded when the app uses it).
        consumerProguardFiles("core-rules.pro")
    }

    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    // OkHttp is the app's own dependency: DurbunInterceptor links against whatever version it ships.
    compileOnly("com.squareup.okhttp3:okhttp:4.12.0") {
        exclude group: "org.jetbrains.kotlin"
    }
}
