// Android side of package:durbun.
//
// The native core (Kotlin + one Java file) lives in sdks/android/durbun, where native-only apps use it too.
// It is compiled into this plugin straight from there (Gradle sourceSets): nothing is copied, nothing can
// drift. This works for every way a Flutter app can depend on the plugin from the Dürbün repository
// (`path:` or `git:` dependency): both keep the whole repository on disk.
group = "dev.durbun.flutter"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def durbunCore = file("../../../android/durbun")
if (!new File(durbunCore, "src/main/kotlin/dev/durbun/Durbun.kt").exists()) {
    throw new GradleException(
        "Dürbün: the native Android core was not found at ${durbunCore}. Depend on package:durbun through " +
            "the Dürbün repository (a path: or git: dependency on sdks/flutter/durbun), not on a copy of the " +
            "plugin folder alone."
    )
}

android {
    namespace = "dev.durbun.flutter"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += [
            "src/main/kotlin",
            "${durbunCore}/src/main/kotlin",
            "${durbunCore}/src/main/java",
        ]
    }

    defaultConfig {
        minSdk = 21
        // OkHttp is optional for the app (DurbunInterceptor is only loaded when the app uses it).
        consumerProguardFiles("${durbunCore}/consumer-rules.pro")
    }

    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    // OkHttp is the app's own dependency: DurbunInterceptor links against whatever version it ships.
    compileOnly("com.squareup.okhttp3:okhttp:4.12.0") {
        exclude group: "org.jetbrains.kotlin"
    }
}
