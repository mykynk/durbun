name: durbun
description: >-
  Network, log and crash inspector for Flutter apps: an in-app panel on the
  phone and live streaming to the Dürbün Mac app, with mocks and native capture.
version: 0.2.0
homepage: https://appnify.dev/durbun/
repository: https://github.com/mykynk/durbun/tree/HEAD/sdks/flutter/durbun
issue_tracker: https://github.com/mykynk/durbun/issues
screenshots:
  - description: Requests in the in-app panel, with status, duration and size.
    path: screenshots/network.webp
  - description: A response body as a JSON tree.
    path: screenshots/response.webp
  - description: Logs, errors, crashes and requests in one stream.
    path: screenshots/logs.webp
  - description: Frame rate, frame times, memory and CPU.
    path: screenshots/performance.webp
  - description: Tools - Mac connection, statistics, export and the previous run.
    path: screenshots/tools.webp
topics:
  - debugging
  - network
  - logging
  - inspector
  - http

environment:
  # Flutter 3.27: Color.withValues / Color.from, Row(spacing:),
  # NavigatorPopHandler.onPopWithResult.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Turkish Material texts in the inspector widget tests.
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only used by the integration tests to prove package:http (IOClient) is captured.
  http: ^1.5.0

flutter:
  plugin:
    platforms:
      # Native cores: synced copies of sdks/android/durbun (android/src/core)
      # and sdks/ios/Sources/Durbun (ios/durbun/Sources/durbun/Core), see
      # tool/sync_native.dart.
      android:
        package: dev.durbun.flutter
        pluginClass: DurbunFlutterPlugin
      ios:
        pluginClass: DurbunFlutterPlugin
